<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- Numeric globe: an homage to atproto.com's ASCII Earth — continents as
	     amber hash glyphs inside a dotted rim, on the survey's dusk ground. -->
	<rect width="64" height="64" rx="14" fill="#0b0908"/>
	<g fill="none" stroke="#e5a04b" stroke-width="2" stroke-linecap="round" opacity="0.85">
		<circle cx="32" cy="32" r="24" stroke-dasharray="0.1 5.2"/>
	</g>
	<g font-family="Menlo, Consolas, monospace" font-size="9" font-weight="bold" fill="#f0b45e">
		<text x="17" y="22">###</text>
		<text x="24" y="30">##</text>
		<text x="30" y="38">###</text>
		<text x="36" y="46">##</text>
	</g>
	<g fill="#e5a04b" opacity="0.6">
		<circle cx="44" cy="21" r="1.3"/>
		<circle cx="47" cy="27" r="1.3"/>
		<circle cx="20" cy="40" r="1.3"/>
		<circle cx="18" cy="33" r="1.3"/>
		<circle cx="42" cy="15" r="1.1"/>
	</g>
</svg>
